<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BidHouse — Room Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/room-lobby.css">

</head>
<body>
  <input type="checkbox" id="theme-toggle" class="theme-toggle-input">
  <script src="./js/theme.js"></script>
  <div class="page">

    <a href="home.html" class="back-link">&#8592; Leave</a>

    <!-- Reached after /api/room/createroom redirects here (e.g. room-lobby.html?code=X7K9P2),
         or after joining via a code from home.html. lobby.js should:
         1. Read the room code from the URL / session and fetch live room state.
         2. Fill in #roomCode, #lobbySummary, #playerList, #playerCount, #playerMax.
         3. Keep the list live (poll or websocket) as players join/leave.
         4. Show #startAuctionBtn enabled only for the host, once >= 2 players. -->
    <main class="view">
      <div class="lobby-card">

        <div class="lobby-brand">
          <span class="lobby-brand__icon">🏏</span>
          <span class="lobby-brand__title">IPL AUCTION</span>
        </div>

        <p class="lobby-label">Room Code</p>
        <div class="room-code">
          <span id="roomCode"></span>
          <button type="button" class="icon-btn" id="copyCodeIcon" title="Copy code">&#128203;</button>
        </div>

        <!-- Filled in by lobby.js from the room's actual settings -->
        <div class="lobby-summary" id="lobbySummary">
          <span class="lobby-summary__chip">&#8377;</span>
          <span class="lobby-summary__chip"></span>
          <span class="lobby-summary__chip"></span>
        </div>

        <ul class="player-list" id="playerList">
          <li class="player-row">
            <span class="player-row__avatar"></span>
            <span class="player-row__name"></span>
            <span class="player-row__badge">Host</span>
          </li>
          <li class="player-row player-row--empty">
            <span class="player-row__avatar player-row__avatar--empty">&#8230;</span>
            <span class="player-row__name player-row__name--muted">
              Waiting for players
              <span class="waiting-dots"><span></span><span></span><span></span></span>
            </span>
          </li>
        </ul>

        <p class="player-count">Players: <span id="playerCount"></span> / <span id="playerMax"></span></p>

        <div class="lobby-actions">
          <button type="button" class="btn-secondary" id="copyCodeBtn">Copy Code</button>
          <button type="button" class="btn-secondary" id="shareLinkBtn">Share Link</button>
        </div>

        <!-- Only the host sees this — lobby.js should hide it for joiners -->
        <button type="button" class="btn-primary btn-primary--wide" id="startAuctionBtn" disabled>
          Start Auction
        </button>
        <button class="btn-primary btn-primary--wide" id="leaveRoomBtn" type="button">
            Leave Room
        </button>
        <p class="start-hint">Waiting for at least 2 players to begin</p>

      </div>
    </main>

    </div>
    <script>
    console.log("LOBBY URL:", window.location.href);
    console.log("ROOM CODE:", new URLSearchParams(window.location.search).get("code"));
    </script>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="./js/lobby.js"></script>
</body>
</html>
