server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /home {
        rewrite ^ /home.html last;
    }

    location = /create-room {
        rewrite ^ /create_room.html last;
    }

    location = /join-room {
        rewrite ^ /join_room.html last;
    }

    location = /room-lobby {
        rewrite ^ /room_lobby.html last;
    }

    location = /auction-room {
        rewrite ^ /auction_room.html last;
    }

    location = /players-list {
        rewrite ^ /players-list.html last;
    }

    location = /auction-rules {
        rewrite ^ /auction-rules.html last;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
