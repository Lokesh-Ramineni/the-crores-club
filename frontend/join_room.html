    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidHouse — Join Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/join-room.css">
    </head>
    <body>

    <div class="page">

        <a href="home.html" class="back-link">&#8592; Back</a>

        <!-- Submits to /api/room/joinroom. Works with zero JS as long as the backend
            either responds with a redirect (302) to room-lobby.html?code=<CODE> on
            success, or re-renders this page with an error message when the code
            is invalid/room is full.
            If you'd rather validate via fetch() before navigating (nicer UX —
            no full page reload on a wrong code), join-room.js can intercept
            submit, POST the same field, and either show #codeError inline or do
            window.location.href = `room-lobby.html?code=${roomCode}` on success. -->
        <main class="view">
        <form class="join-card" id="joinRoomForm" action="/api/rooms/join" method="POST" novalidate>

            <div class="card-head">
            <span class="card-head__icon">&#127918;</span>
            <h1>Join Auction Room</h1>
            <p>Enter the 6-character code your host shared with you.</p>
            </div>

            <div class="field-group">
            <label class="field-group__label" for="roomCodeInput">Room Code</label>
            <input
                type="text"
                id="roomCodeInput"
                name="room_code"
                class="code-field"
                placeholder="X7K9P2"
                maxlength="6"
                minlength="6"
                pattern="[A-Za-z0-9]{6}"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                required
            >
            <!-- Hidden until join-room.js flags an invalid/expired/full code -->
            <p class="field-error" id="codeError">Room not found. Check the code and try again.</p>
            <p class="field-hint">Codes are 6 letters and numbers, not case-sensitive.</p>
            </div>

            <button type="submit" class="btn-primary">Join Room</button>

            <p class="switch-text">Don't have a code?
            <a href="create_room.html" class="switch-link">Create your own room</a>
            </p>

            <!-- Small bonus — visual only, not linked to any backend yet.
                If you want this to actually prefill the code, join-room.js can
                read ?code= from each chip's href and drop it into #roomCodeInput. -->
            <div class="recent-rooms">
            <span class="recent-rooms__label">Recently joined</span>
            <div class="recent-rooms__chips">
                <a href="join-room.html?code=TEAMX9" class="recent-chip">TEAMX9</a>
                <a href="join-room.html?code=SQUAD1" class="recent-chip">SQUAD1</a>
            </div>
            </div>

        </form>
        </main>

    </div>
    <script src="./js/join_room.js" ></script>
    </body>
    </html>
