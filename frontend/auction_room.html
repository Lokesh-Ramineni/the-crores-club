<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BidHouse — Live Auction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auction-room.css">
</head>
<body>

  <input type="checkbox" id="theme-toggle" class="theme-toggle-input">
  <script src="./js/theme.js"></script>

  <div class="page">

    <header class="topbar">
      <span class="round-info">Round <span id="roundCurrent">&mdash;</span> of <span id="roundTotal">&mdash;</span></span>


      <div class="host-controls" id="hostControls">
        <button type="button" class="btn-ghost" id="forceSkipBtn">
          <span class="btn-ghost__icon">&#9654;&#65039;</span> Force Skip
        </button>
        <button type="button" class="btn-ghost" id="pauseBtn">
          <span class="btn-ghost__icon">&#9208;&#65039;</span> Pause
        </button>
      </div>
    </header>

    <main class="auction-card">

      <div class="player-row">
        <span class="player-avatar" id="playerAvatar">&hellip;</span>


        <div class="player-info">
          <div class="player-name-row">
            <h1 class="player-name" id="playerName">Loading auction&hellip;</h1>
            <span class="tag" id="playerTag">&mdash;</span>

          </div>
          <p class="player-meta"><span id="playerRole">&mdash;</span> &bull; Base <span id="playerBase">&mdash;</span></p>
        </div>

        <div class="timer-box">
          <span class="timer-label">Time left</span>
          <span class="timer-value" id="timerValue">--:--</span>

        </div>
      </div>

      <div class="divider"></div>

      <div class="bid-row">
        <span class="bid-label">Current bid</span>
        <span class="bid-value">
          <span id="currentBid">&mdash;</span>
          <span class="bid-by">&mdash; <span id="currentBidder">No bids yet</span></span>

        </span>
      </div>

      <div class="alert alert--warning" id="outbidAlert">
        <span class="alert__icon">&#9888;</span> You've been outbid
      </div>

      <div class="bid-actions">
        <button type="button" class="bid-btn" data-increment="0.5">+0.5 cr</button>
        <button type="button" class="bid-btn" data-increment="1">+1 cr</button>
        <button type="button" class="bid-btn" data-increment="2">+2 cr</button>
        <button type="button" class="bid-btn bid-btn--pass" id="passBtn">Pass</button>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <span class="stat-label">Your purse</span>
          <span class="stat-value" id="yourPurse">&mdash;</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Squad</span>
          <span class="stat-value" id="squadCount"></span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Players left</span>
          <span class="stat-value" id="playersLeft"></span>
        </div>
      </div>
    </main>

    <section class="other-players">
      <h3 class="other-players__title">Other players</h3>

      <div class="other-players__list" id="otherPlayersList">
      </div>

    </section>

    <section class="my-purchases">
      <button type="button" class="my-purchases__toggle" id="myPurchasesToggle">
        <span>My purchases</span>
        <span class="my-purchases__meta">
          <span class="my-purchases__count" id="myPurchasesCount">0</span>
          <span class="my-purchases__chevron" id="myPurchasesChevron">&#9662;</span>
        </span>
      </button>

      <div class="my-purchases__panel" id="myPurchasesPanel" hidden>
        <p class="my-purchases__empty" id="myPurchasesEmpty">No players purchased yet.</p>
        <ul class="my-purchases__list" id="myPurchasesList"></ul>
      </div>
    </section>

  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="./js/auction_room/dom.js"></script>
  <script src="./js/auction_room/utils.js"></script>
  <script src="./js/auction_room/timer.js"></script>
  <script src="./js/auction_room/render.js"></script>
  <script src="./js/auction_room/bid.js"></script>
  <script src="./js/auction_room/socket.js"></script>
  <script src="./js/auction_room/api.js"></script>
  <script src="./js/auction_room/host-controls.js"></script>
  <script src="./js/auction_room/main.js"></script>
  <script src="./js/auction_room/purchases.js"></script>
</body>
</html>
